[package]
name = "brapi"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.9", features = ["json"] }
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
chrono = "0.4"
tokio-postgres = "0.7"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
